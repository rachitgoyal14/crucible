<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="crucible logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#171c24"/>
    </linearGradient>
    <radialGradient id="melt" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff7a29"/>
      <stop offset="1" stop-color="#c9184a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
