  <ellipse cx="256" cy="150" rx="106" ry="18" fill="#12161c" stroke="#3d444d" stroke-width="3"/>
  <ellipse cx="256" cy="150" rx="90" ry="12" fill="url(#melt)"/>
  <ellipse cx="238" cy="147" rx="30" ry="4" fill="#ffe8a3" opacity="0.75"/>

  <circle cx="298" cy="102" r="6" fill="#ffb347"/>
