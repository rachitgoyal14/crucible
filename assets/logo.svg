  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <ellipse cx="256" cy="230" rx="180" ry="130" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="256" cy="404" rx="118" ry="14" fill="#000000" opacity="0.35" filter="url(#blur)"/>

